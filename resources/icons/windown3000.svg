<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33DDE0"/>
      <stop offset="1" stop-color="#1A8BCB"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF6FA"/>
    </linearGradient>
  </defs>

  <!-- Outer rim -->
  <circle cx="256" cy="256" r="240" fill="url(#ring)"/>
  <!-- Inner gradient disc -->
  <circle cx="256" cy="256" r="208" fill="url(#bg)"/>

  <!-- "W" glyph (replaces the "M") -->
  <polyline points="129,188 162,322 204,222 246,322 279,188"
            fill="none" stroke="url(#glyph)" stroke-width="34"
            stroke-linejoin="bevel" stroke-linecap="butt"/>

  <!-- Down arrow (unchanged) -->
  <path d="M333 188 H377 V256 H414 L355 322 L296 256 H333 Z" fill="url(#glyph)"/>
</svg>
